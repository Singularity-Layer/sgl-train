name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish immutable candidate images for a reviewed commit
        required: true
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            runner_release="ghcr.io/singularity-layer/sgl-train:v0.6.0"
            seed_release="ghcr.io/singularity-layer/sgl-train:seed-v0.6.0"
          else
            runner_release="ghcr.io/singularity-layer/sgl-train:candidate-${GITHUB_SHA}"
            seed_release="ghcr.io/singularity-layer/sgl-train:seed-candidate-${GITHUB_SHA}"
          fi
          {
            echo "runner<<EOF"
            echo "${runner_release}"
            echo "ghcr.io/singularity-layer/sgl-train:${GITHUB_SHA}"
            echo "EOF"
            echo "seed<<EOF"
            echo "${seed_release}"
            echo "ghcr.io/singularity-layer/sgl-train:seed-${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.runner }}
      - name: Print digest to pin in the backend
        run: echo "PIN THIS DIGEST → ${{ steps.push.outputs.digest }}"
      - uses: docker/build-push-action@v6
        id: seed
        with:
          context: .
          file: Dockerfile.seed
          push: true
          tags: ${{ steps.tags.outputs.seed }}
      - name: Print seeder digest
        run: echo "SEEDER DIGEST → ${{ steps.seed.outputs.digest }}"
