[project]
name = "sgl-train-runner"
version = "0.1.0"
description = "On-box runner for Singularity Layer managed training"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
